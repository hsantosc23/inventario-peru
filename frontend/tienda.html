<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Tienda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--c:#c2714f;--tx:#15171a;--gr:#6b7280;--bd:#e7e7e7;--bg:#fff;--soft:#f7f7f5;
  --fh:"Playfair Display",Georgia,serif;--fb:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
:root[data-f="moderna"]{--fh:Inter,system-ui,sans-serif}
:root[data-f="clasica"]{--fh:"Cormorant Garamond",Georgia,serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--fb);color:var(--tx);background:var(--bg);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding-left:20px;padding-right:20px}
.up{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:600}
.h{font-family:var(--fh)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* aviso y cabecera */
.aviso{background:var(--abg,#111);color:var(--atx,#fff);text-align:center;padding:10px 16px}
.hdr{position:sticky;top:0;z-index:40;background:var(--hbg,var(--soft));color:var(--htx,var(--tx));border-bottom:1px solid var(--bd)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-top:14px;padding-bottom:14px}
.hl,.hr{display:flex;align-items:center;gap:4px}
.hr{justify-content:flex-end}
.lk{color:inherit;text-decoration:none;cursor:pointer;background:none;border:0;padding:8px 0}
.lk:hover{text-decoration:underline}
.logo{font-family:var(--fh);font-size:28px;font-weight:700;text-align:center;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo img{max-height:46px;width:auto;margin:0 auto}
.ib{width:42px;height:42px;border:0;background:none;cursor:pointer;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;color:inherit}
.ib:hover{background:rgba(0,0,0,.06)}
.ib b{position:absolute;top:3px;right:1px;background:var(--tx);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:none;align-items:center;justify-content:center;padding:0 4px}
.ib.sm{display:none}

/* secciones */
.s{--pad:56px;position:relative;background:var(--sbg,transparent);color:var(--stx,inherit);padding:var(--pad) 0;font-size:calc(16px * var(--esc,1));scroll-margin-top:80px}
.s.full>.wrap{max-width:none}
.s h3.h{font-size:1.6em;margin:0 0 .9em;font-weight:600;letter-spacing:-.01em}
.tx{line-height:1.6}
.ac .tx{text-align:center}
.ar .tx{text-align:right}

/* portada y banner */
.s-portada,.s-banner{--pad:0px}
.hero{position:relative;min-height:var(--alto,70vh);display:flex;align-items:center;background:#1d2634 center/cover no-repeat;color:#fff;overflow:hidden}
.hero.sin{background:linear-gradient(135deg,var(--c),#15171a)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,14,22,.9) 0%,rgba(10,14,22,.45) 55%,rgba(10,14,22,.12) 100%);opacity:var(--osc,.7);pointer-events:none}
.hero.sin::after{display:none}
.hero>.wrap{position:relative;z-index:2;width:100%}
.hero .in{max-width:620px;padding:56px 0}
.ac .hero .in{margin:0 auto;text-align:center}
.ar .hero .in{margin-left:auto;text-align:right}
.ac .hero::after{background:rgba(10,14,22,.75)}
.ar .hero::after{background:linear-gradient(270deg,rgba(10,14,22,.9) 0%,rgba(10,14,22,.45) 55%,rgba(10,14,22,.12) 100%)}
.hero .eb{display:inline-block;border-top:1px solid rgba(255,255,255,.55);padding-top:12px;margin-bottom:12px}
.hero h2{font-family:var(--fh);font-size:calc(var(--esc,1) * clamp(34px,6vw,64px));line-height:1.04;margin:0 0 14px;font-weight:600}
.hero p{margin:0 0 26px;font-size:1.05em;line-height:1.5;opacity:.95;white-space:pre-line}
.cta{display:inline-block;background:var(--btn,var(--c));color:#fff;border:0;cursor:pointer;padding:15px 28px;text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:600}
.cta:hover{filter:brightness(1.08)}
.box.s-portada,.box.s-banner{--pad:20px}
.box .hero{border-radius:18px;max-width:1240px;margin:0 auto;width:calc(100% - 40px)}

/* beneficios */
.s-beneficios{--pad:0px}
.bens{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)}
.ben{display:flex;gap:10px;align-items:center;justify-content:center;padding:18px 12px;border-left:1px solid var(--bd)}
.ben:first-child{border-left:0}
.ben .e{font-size:1.4em}

/* buscador */
.s-buscador{--pad:40px}
.search{display:flex;max-width:520px;margin-bottom:16px}
.search input{flex:1;font:inherit;font-size:15px;padding:14px 16px;border:1px solid var(--bd);border-radius:0;background:#fff;color:var(--tx);min-width:0}
.search input:focus{outline:0;border-color:var(--tx)}
.ac .search{margin-left:auto;margin-right:auto}
.ar .search{margin-left:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.ac .chips{justify-content:center}
.ar .chips{justify-content:flex-end}
.chip{flex:0 0 auto;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:9px 18px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;border-radius:999px}
.chip.on{background:var(--tx);border-color:var(--tx);color:#fff}

/* productos */
.grid{display:grid;gap:28px 18px;grid-template-columns:repeat(4,1fr)}
.cols-2 .grid{grid-template-columns:repeat(2,1fr)}
.cols-3 .grid{grid-template-columns:repeat(3,1fr)}
.cols-5 .grid{grid-template-columns:repeat(5,1fr)}
.pc{display:flex;flex-direction:column;gap:8px;min-width:0}
.ph{position:relative;aspect-ratio:3/4;background:#f1f1ef;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.pc:hover .ph img{transform:scale(1.04)}
.ph .ini{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-size:52px;color:#c9c9c5}
.off{position:absolute;right:10px;bottom:10px;background:#e01f26;color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.pn{font-size:.9em;line-height:1.35}
.pp{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pp .old{color:#9aa0a6;text-decoration:line-through;font-size:.85em}
.pp .now{font-weight:700}
.add{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border:1px solid currentColor;background:transparent;padding:11px;margin-top:2px}
.add:hover{background:var(--tx);color:#fff;border-color:var(--tx)}
.add:disabled{opacity:.4;cursor:default;background:transparent;color:inherit}
.vacio{text-align:center;color:var(--gr);padding:40px 0;grid-column:1/-1;margin:0}

/* texto e imagen */
.s-texto .wrap{max-width:820px}
.s-texto p{white-space:pre-line;margin:0;font-size:1.05em}
.s-imagen{--pad:0px}
.s-imagen.full>.wrap{padding:0}
.s-imagen img{width:100%;height:var(--alto,auto);object-fit:cover}
.box.s-imagen{--pad:20px}
.box.s-imagen img{border-radius:18px}
.ph0{height:240px;background:#f1f1ef;display:flex;align-items:center;justify-content:center;color:var(--gr)}

/* información y pie */
.s-info p{margin:.4em 0;font-size:1.02em}
.pie{background:var(--fbg,var(--soft));color:var(--ftx,var(--gr));border-top:1px solid var(--bd);padding:40px 0;font-size:14px;line-height:1.8}
.pie b{color:var(--ftx,var(--tx));font-family:var(--fh);font-size:22px;font-weight:600}

/* búsqueda desde la cabecera */
.srch{position:fixed;top:0;left:0;right:0;z-index:55;background:#fff;border-bottom:1px solid var(--bd);box-shadow:0 10px 30px rgba(0,0,0,.08);transform:translateY(-105%);transition:transform .25s}
.srch.on{transform:none}
.srch .wrap{display:flex;gap:8px;align-items:center;padding-top:12px;padding-bottom:12px}
.srch input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--bd);min-width:0;border-radius:0}

/* carrito */
.ov{position:fixed;inset:0;background:rgba(15,17,22,.5);z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;color:var(--tx);z-index:70;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.dw.on{transform:none}
.dw-h{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--bd)}
.dw-h b{flex:1;font-family:var(--fh);font-size:20px;font-weight:600}
.dw-b{flex:1;overflow:auto;padding:8px 20px}
.dw-f{padding:20px;border-top:1px solid var(--bd)}
.it{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--bd)}
.it .mi{width:62px;height:78px;background:#f1f1ef;flex:none;overflow:hidden}
.it .mi img{width:100%;height:100%;object-fit:cover}
.it .in{flex:1;min-width:0}
.it .in b{display:block;font-size:14px;font-weight:500}
.it .in small{color:var(--gr)}
.qt{display:flex;align-items:center;gap:6px}
.qt button{width:30px;height:30px;border:1px solid var(--bd);background:#fff;cursor:pointer}
.tot{display:flex;justify-content:space-between;font-size:19px;font-weight:700;margin-bottom:14px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:#fff;cursor:pointer;flex:none}

/* WhatsApp flotante */
.wa{position:fixed;right:18px;bottom:18px;z-index:50;width:58px;height:58px;border-radius:50%;background:#25d366;border:0;cursor:pointer;box-shadow:0 8px 22px rgba(37,211,102,.45);display:flex;align-items:center;justify-content:center}
.wa svg{width:30px;height:30px;fill:#fff}

/* tablet */
@media(max-width:1024px){
  .grid,.cols-5 .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:860px){
  .bens{grid-template-columns:1fr 1fr}
  .ben:nth-child(odd){border-left:0}
  .ben:nth-child(n+3){border-top:1px solid var(--bd)}
}
/* celular */
@media(max-width:700px){
  .hd{grid-template-columns:44px 1fr 44px;padding-top:10px;padding-bottom:10px}
  .hl .lk{display:none}
  .ib.sm{display:flex}
  .hr .ib.dk{display:none}
  .logo{font-size:22px}
  .logo img{max-height:38px}
  .grid,.cols-3 .grid,.cols-5 .grid{grid-template-columns:repeat(2,1fr);gap:22px 12px}
  .s{--pad:36px}
  .s-portada,.s-banner,.s-beneficios,.s-imagen{--pad:0px}
  .s-buscador{--pad:28px}
  .hero{min-height:var(--alto,62vh)}
  .hero .in{padding:44px 0}
  .s-portada:not(.al) .hero .in,.s-banner:not(.al) .hero .in{margin:0 auto;text-align:center}
  .s-portada:not(.al) .hero::after,.s-banner:not(.al) .hero::after{background:rgba(10,14,22,.7)}
  .ben{justify-content:flex-start;padding:14px}
  .box .hero{width:calc(100% - 24px)}
}
</style>
</head>
<body>
<div id="app"><div class="wrap"><p class="vacio">Cargando tienda...</p></div></div>

<div class="srch" id="srch"><div class="wrap">
  <input type="search" id="q2" placeholder="¿Qué estás buscando?" autocomplete="off" enterkeyhint="search">
  <button class="x" onclick="cerrarBusqueda()" aria-label="Cerrar">✕</button>
</div></div>

<div class="ov" id="ov" onclick="verCarrito(false)"></div>
<aside class="dw" id="dw" aria-label="Tu pedido">
  <div class="dw-h"><b>Tu pedido</b><button class="x" onclick="verCarrito(false)" aria-label="Cerrar">✕</button></div>
  <div class="dw-b" id="dw-b"></div>
  <div class="dw-f">
    <div class="tot"><span>Total</span><span id="dw-t">S/ 0.00</span></div>
    <button class="cta" style="width:100%;padding:16px" onclick="pedirWhatsApp()">Comprar por WhatsApp</button>
  </div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/js/config.js"></script>
<script src="/js/supabase-client.js"></script>
<script>
const SLUG = (new URLSearchParams(location.search).get("t") || "").trim().toLowerCase();
const LS = "carrito-" + SLUG;
const BASE = ["portada", "beneficios", "buscador", "destacados", "catalogo", "info"];
const NOMBRES = { portada: "Portada", beneficios: "Beneficios", buscador: "Buscador", destacados: "Destacados",
  catalogo: "Catálogo", info: "Información", banner: "Banner", texto: "Texto", imagen: "Imagen" };
const COLS_FOTO = ["foto_url", "foto", "imagen", "imagen_url"];
const ICO = {
  lupa: '<svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  bolsa: '<svg class="i" viewBox="0 0 24 24"><path d="M5.5 8h13l-1 12h-11z"/><path d="M9 8V6.5a3 3 0 016 0V8"/></svg>',
  cam: '<svg class="i" viewBox="0 0 24 24" style="width:15px;height:15px"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  wa: '<svg viewBox="0 0 24 24"><path d="M.06 24l1.69-6.16a11.87 11.87 0 01-1.6-5.95C.16 5.33 5.5 0 12.06 0a11.8 11.8 0 018.4 3.49 11.8 11.8 0 013.48 8.41c0 6.56-5.34 11.9-11.9 11.9a11.9 11.9 0 01-5.7-1.45L.06 24zm6.6-3.8c1.65.98 3.22 1.57 5.4 1.57 5.44 0 9.88-4.43 9.89-9.88a9.88 9.88 0 00-16.87-7 9.88 9.88 0 00-1.5 12.03l-1 3.65 3.75-.98zm11.4-5.1c-.07-.12-.27-.2-.57-.35-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.08a8.1 8.1 0 01-2.38-1.47 9 9 0 01-1.66-2.06c-.17-.3-.02-.46.13-.6.14-.14.3-.36.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.02-.53-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51l-.57-.01c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.07 2.88 1.22 3.08.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.7.63.71.22 1.36.19 1.87.12.57-.09 1.76-.72 2-1.42.25-.7.25-1.29.18-1.41z"/></svg>'
};

let T = null, D = {}, ITEMS = [], CAT = "", Q = "", QRAW = "", CAR = {}, DUENO = false, EDIT = false;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const cssv = s => String(s ?? "").replace(/[;"<>{}\\]/g, "");
const urlCss = u => 'url("' + String(u || "").replace(/["\\\n\r]/g, c => encodeURIComponent(c)) + '")';
const sol = n => "S/ " + Number(n || 0).toFixed(2);
const uid = () => Math.random().toString(36).slice(2, 9);
const foto = p => { for (const k of COLS_FOTO) if (/^(https?:|data:)/.test(p[k] || "")) return p[k]; return null; };
const cat = p => (p.atributos && T.campo_categoria) ? (p.atributos[T.campo_categoria] || "") : "";

try { CAR = JSON.parse(localStorage.getItem(LS) || "{}") || {}; } catch (e) { CAR = {}; }
const guardarCar = () => { try { localStorage.setItem(LS, JSON.stringify(CAR)); } catch (e) {} };

/* ---------- Carga ---------- */
(async function(){
  if (!SLUG) return fallo("Falta el enlace de la tienda.");
  try {
    const { data: s } = await sb.auth.getSession();
    if (s && s.session) {
      const { data: t } = await sb.from("tiendas").select("*").eq("slug", SLUG).maybeSingle();
      if (t) {
        DUENO = true; T = t;
        const [r1, r2] = await Promise.all([
          sb.from("productos").select("*").eq("negocio_id", t.negocio_id).eq("en_tienda", true)
            .order("destacado", { ascending: false }).order("nombre"),
          sb.from("servicios").select("*").eq("negocio_id", t.negocio_id).eq("activo", true)
        ]);
        ITEMS = ((r1 && r1.data) || []).concat(((r2 && r2.data) || []).map(x => ({ ...x, es_servicio: true })));
      }
    }
  } catch (e) {}
  if (!T) {
    const { data } = await sb.rpc("tienda_publica", { p_slug: SLUG });
    if (!data) return fallo("Esta tienda no existe o todavía no está publicada.");
    T = data.tienda;
    ITEMS = (data.productos || []).concat(data.servicios || []);
  }
  normalizar();
  pintar();
  pintarCarrito();
  if (DUENO) {
    const s = document.createElement("script");
    s.src = "/js/tienda-editor.js?v=3";
    document.body.appendChild(s);
  }
})();

function fallo(m){ $("app").innerHTML = `<div class="wrap"><p class="vacio">${esc(m)}</p></div>`; }

// Ordena los datos guardados: cabecera y aviso son fijos, el resto se puede mover
function normalizar(){
  D = (T.disenio && typeof T.disenio === "object") ? T.disenio : {};
  let sec = Array.isArray(T.secciones) ? T.secciones : [];
  const av = sec.find(s => s.k === "aviso");
  if (av && D.aviso_on === undefined) D.aviso_on = av.on ? 1 : 0;
  if (D.aviso_on === undefined) D.aviso_on = 1;
  sec = sec.filter(s => s && s.k && s.k !== "aviso" && NOMBRES[s.k])
    .map(s => ({ id: s.id || uid(), k: s.k, on: s.on ? 1 : 0, st: s.st || {}, c: s.c || {} }));
  BASE.forEach((k, i) => {
    if (!sec.some(s => s.k === k)) sec.splice(Math.min(i, sec.length), 0, { id: uid(), k, on: 1, st: {}, c: {} });
  });
  T.secciones = sec;
}

/* ---------- Dibujo ---------- */
function aplicarTema(){
  document.documentElement.style.setProperty("--c", cssv(T.color || "#c2714f"));
  document.documentElement.dataset.f = D.fuente || "elegante";
  document.title = T.titulo || "Tienda";
}

function pintar(){
  aplicarTema();
  const a = D.avisoSt || {}, h = D.header || {}, f = D.footer || {};
  let html = "";
  if (D.aviso_on || EDIT) {
    const v = (a.bg ? "--abg:" + cssv(a.bg) + ";" : "") + (a.tx ? "--atx:" + cssv(a.tx) : "");
    html += `<div class="aviso up${D.aviso_on ? "" : " oculta"}" data-fix="aviso" style="${esc(v)}">${esc(T.aviso || "Envíos a todo el Perú")}</div>`;
  }
  const vh = (h.bg ? "--hbg:" + cssv(h.bg) + ";" : "") + (h.tx ? "--htx:" + cssv(h.tx) : "");
  const logo = D.logo ? `<img src="${esc(D.logo)}" alt="${esc(T.titulo || "")}">` : esc(T.titulo || "Tienda");
  html += `<header class="hdr" data-fix="cabecera" style="${esc(vh)}"><div class="wrap hd">
      <div class="hl"><button class="lk up" data-go="catalogo">${esc(D.menu || "Ver catálogo")}</button>
        <button class="ib sm" data-act="buscar" aria-label="Buscar">${ICO.lupa}</button></div>
      <div class="logo">${logo}</div>
      <div class="hr"><button class="ib dk" data-act="buscar" aria-label="Buscar">${ICO.lupa}</button>
        <button class="ib" data-act="carrito" aria-label="Ver pedido">${ICO.bolsa}<b id="cnt"></b></button></div>
    </div></header>`;
  html += `<main id="secs">${T.secciones.filter(s => s.on || EDIT).map(secHTML).join("")}</main>`;
  const vf = (f.bg ? "--fbg:" + cssv(f.bg) + ";" : "") + (f.tx ? "--ftx:" + cssv(f.tx) : "");
  html += `<footer class="pie" data-fix="pie" style="${esc(vf)}"><div class="wrap"><b>${esc(T.titulo || "")}</b><br>
      ${T.direccion ? esc(T.direccion) + "<br>" : ""}${T.horario ? esc(T.horario) + "<br>" : ""}
      ${T.whatsapp ? "WhatsApp " + esc(T.whatsapp) : ""}</div></footer>`;
  if (T.whatsapp && !EDIT) html += `<button class="wa" data-act="wa" aria-label="Escríbenos por WhatsApp">${ICO.wa}</button>`;
  $("app").innerHTML = html;
  pintarGrids();
  contarCarrito();
  if (window.trasPintar) window.trasPintar();
}

// Vuelve a dibujar solo una sección (más rápido mientras se edita)
function repintarSec(id){
  const s = T.secciones.find(x => x.id === id), el = document.querySelector(`#secs > [data-id="${id}"]`);
  if (!s || !el) return pintar();
  el.outerHTML = secHTML(s);
  pintarGrids();
  if (window.trasPintar) window.trasPintar();
}

function secHTML(s){
  const st = s.st || {}, k = s.k, v = [];
  if (st.bg) v.push("--sbg:" + st.bg);
  if (st.tx) v.push("--stx:" + st.tx);
  if (st.pad != null) v.push("--pad:" + st.pad + "px");
  if (st.esc) v.push("--esc:" + st.esc);
  if (st.alto) v.push("--alto:" + st.alto + "vh");
  if (st.btn) v.push("--btn:" + st.btn);
  if (st.osc != null) v.push("--osc:" + st.osc);
  const ancho = st.ancho || (["portada", "banner", "imagen", "beneficios"].includes(k) ? "full" : "box");
  const al = st.alin === "c" ? " ac al" : st.alin === "r" ? " ar al" : st.alin === "l" ? " al" : "";
  const cols = st.cols ? " cols-" + st.cols : "";
  return `<section class="s s-${k} ${ancho}${al}${cols}${s.on ? "" : " oculta"}" data-id="${esc(s.id)}" style="${esc(v.map(cssv).join(";"))}">${cuerpo(s)}</section>`;
}

function heroHTML(img, eb, titulo, sub, cta){
  return `<div class="hero${img ? "" : " sin"}"${img ? ` style="${esc("background-image:" + urlCss(img))}"` : ""}><div class="wrap"><div class="in">
    ${eb ? `<div class="eb up">${esc(eb)}</div>` : ""}
    <h2>${esc(titulo || "")}</h2>
    ${sub ? `<p>${esc(sub)}</p>` : ""}
    ${cta ? `<button class="cta" data-go="catalogo">${esc(cta)} →</button>` : ""}
  </div></div></div>`;
}

function cuerpo(s){
  const k = s.k, c = s.c || {};
  if (k === "portada") return heroHTML(T.hero_img, T.hero_eyebrow, T.hero_titulo || T.titulo, T.hero_sub, T.hero_cta == null ? "Comprar ahora" : T.hero_cta);
  if (k === "banner") return heroHTML(c.img, c.eyebrow, c.titulo, c.sub, c.cta == null ? "Ver catálogo" : c.cta);
  if (k === "beneficios") {
    const b = Array.isArray(T.beneficios) ? T.beneficios : [];
    return `<div class="wrap">${b.length ? `<div class="bens">${b.map(x => `<div class="ben"><span class="e">${esc(x.i || "✔")}</span><div class="up">${esc(x.t || "")}</div></div>`).join("")}</div>`
      : (EDIT ? `<p class="vacio">Agrega beneficios desde el editor.</p>` : "")}</div>`;
  }
  if (k === "buscador") {
    const cats = c.nocat ? [] : [...new Set(ITEMS.map(cat).filter(Boolean))].sort();
    return `<div class="wrap"><div class="search"><input type="search" id="q" value="${esc(QRAW)}" placeholder="${esc(c.ph || "Buscar producto...")}" autocomplete="off"></div>
      ${cats.length ? `<div class="chips"><button class="chip${CAT ? "" : " on"}" data-cat="">Todo</button>${cats.map(x => `<button class="chip${CAT === x ? " on" : ""}" data-cat="${esc(x)}">${esc(x)}</button>`).join("")}</div>` : ""}</div>`;
  }
  if (k === "destacados") return `<div class="wrap"><h3 class="h">${esc(c.titulo || "Productos destacados")}</h3><div class="grid" data-g="dest"></div></div>`;
  if (k === "catalogo") return `<div class="wrap"><h3 class="h">${esc(c.titulo || "Todos los productos")}</h3><div class="grid" data-g="cat"></div></div>`;
  if (k === "info") return `<div class="wrap tx"><h3 class="h">${esc(c.titulo || "Dónde estamos")}</h3>
    ${T.direccion ? `<p>📍 ${esc(T.direccion)}</p>` : ""}${T.horario ? `<p>🕒 ${esc(T.horario)}</p>` : ""}
    ${T.whatsapp ? `<p>💬 WhatsApp ${esc(T.whatsapp)}</p>` : ""}
    ${EDIT && !T.direccion && !T.horario && !T.whatsapp ? `<p class="vacio">Completa dirección, horario y WhatsApp desde el editor.</p>` : ""}</div>`;
  if (k === "texto") return `<div class="wrap tx">${c.titulo ? `<h3 class="h">${esc(c.titulo)}</h3>` : ""}<p>${esc(c.txt || "")}</p></div>`;
  if (k === "imagen") return `<div class="wrap">${c.img ? `<img src="${esc(c.img)}" alt="${esc(c.alt || "")}" loading="lazy">`
    : `<div class="ph0">${EDIT ? "Elige una imagen en el editor" : ""}</div>`}</div>`;
  return "";
}

function tarjeta(p){
  const antes = Number(p.precio_antes || 0), ahora = Number(p.precio);
  const off = antes > ahora ? Math.round((1 - ahora / antes) * 100) : 0;
  const hay = p.es_servicio || p.stock > 0, f = foto(p);
  return `<article class="pc">
    <div class="ph">${f ? `<img src="${esc(f)}" alt="${esc(p.nombre)}" loading="lazy">` : `<div class="ini">${esc((p.nombre || "?")[0].toUpperCase())}</div>`}
      ${off ? `<div class="off">Ahorra ${off}%</div>` : ""}
      ${EDIT && !p.es_servicio ? `<button class="fotob" data-ed data-foto="${esc(p.id)}">${ICO.cam} Cambiar foto</button>` : ""}</div>
    <div class="pn">${esc(p.nombre)}</div>
    <div class="pp">${antes > ahora ? `<span class="old">${sol(antes)}</span>` : ""}<span class="now">${sol(ahora)}</span></div>
    <button class="add" ${hay ? "" : "disabled"} data-add="${esc(p.id)}">${hay ? "Agregar" : "Agotado"}</button>
  </article>`;
}

function pintarGrids(){
  const vis = ITEMS.filter(p => (!CAT || cat(p) === CAT) && (!Q || (p.nombre + " " + (p.codigo || "")).toLowerCase().includes(Q)));
  document.querySelectorAll('[data-g="cat"]').forEach(g => {
    g.innerHTML = vis.length ? vis.map(tarjeta).join("") : `<p class="vacio">No encontramos nada con esa búsqueda.</p>`;
  });
  const dest = ITEMS.filter(p => p.destacado), mostrar = dest.length && !Q && !CAT;
  document.querySelectorAll('[data-g="dest"]').forEach(g => {
    g.innerHTML = mostrar ? dest.map(tarjeta).join("")
      : (EDIT ? `<p class="vacio">Marca productos con ★ en Mi tienda para que aparezcan aquí.</p>` : "");
    const sec = g.closest(".s");
    if (sec) sec.style.display = (mostrar || EDIT) ? "" : "none";
  });
}

/* ---------- Interacción del cliente ---------- */
document.addEventListener("click", e => {
  if (EDIT && e.target.closest("#app")) return;
  const t = e.target.closest("[data-add],[data-cat],[data-go],[data-act]");
  if (!t) return;
  const d = t.dataset;
  if (d.add) return agregar(d.add);
  if (d.cat !== undefined) return filtrar(d.cat);
  if (d.go) return irA(d.go);
  if (d.act === "carrito") return verCarrito(true);
  if (d.act === "buscar") return abrirBusqueda();
  if (d.act === "wa") return escribirnos();
});
document.addEventListener("input", e => {
  if (e.target.id === "q" || e.target.id === "q2") buscar(e.target.value, e.target.id);
});
document.addEventListener("keydown", e => {
  if (e.target.id === "q2" && e.key === "Enter") { cerrarBusqueda(); irA("catalogo"); }
  if (e.key === "Escape") { cerrarBusqueda(); verCarrito(false); }
});

function buscar(v, desde){
  QRAW = v; Q = v.trim().toLowerCase();
  const otro = $(desde === "q" ? "q2" : "q");
  if (otro && otro.value !== v) otro.value = v;
  pintarGrids();
}
function filtrar(c){
  CAT = c;
  document.querySelectorAll(".chip").forEach(b => b.classList.toggle("on", b.dataset.cat === c));
  pintarGrids();
}
function irA(k){
  const el = document.querySelector(".s-" + k);
  if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function abrirBusqueda(){
  $("srch").classList.add("on");
  $("q2").value = QRAW;
  setTimeout(() => $("q2").focus(), 60);
}
function cerrarBusqueda(){ $("srch").classList.remove("on"); }

/* ---------- Carrito ---------- */
function agregar(id){
  const p = ITEMS.find(x => x.id === id); if (!p) return;
  if (!p.es_servicio && (CAR[id] || 0) >= p.stock) return alert("No tenemos más unidades de " + p.nombre + ".");
  CAR[id] = (CAR[id] || 0) + 1;
  guardarCar(); pintarCarrito(); verCarrito(true);
}
function cant(id, d){
  const p = ITEMS.find(x => x.id === id);
  const n = (CAR[id] || 0) + d;
  if (p && !p.es_servicio && n > p.stock) return;
  if (n <= 0) delete CAR[id]; else CAR[id] = n;
  guardarCar(); pintarCarrito();
}
function idsCarrito(){ return Object.keys(CAR).filter(id => ITEMS.some(p => p.id === id)); }
function contarCarrito(){
  const n = idsCarrito().reduce((s, id) => s + CAR[id], 0), b = $("cnt");
  if (b) { b.textContent = n; b.style.display = n ? "flex" : "none"; }
}
function pintarCarrito(){
  let total = 0;
  const h = idsCarrito().map(id => {
    const p = ITEMS.find(x => x.id === id), c = CAR[id], f = foto(p);
    total += Number(p.precio) * c;
    return `<div class="it"><div class="mi">${f ? `<img src="${esc(f)}" alt="">` : ""}</div>
      <div class="in"><b>${esc(p.nombre)}</b><small>${sol(p.precio)} c/u</small></div>
      <div class="qt"><button onclick="cant('${esc(id)}',-1)" aria-label="Quitar uno">−</button><span>${c}</span><button onclick="cant('${esc(id)}',1)" aria-label="Agregar uno">+</button></div></div>`;
  }).join("");
  $("dw-b").innerHTML = h || `<p class="vacio">Tu pedido está vacío.</p>`;
  $("dw-t").textContent = sol(total);
  contarCarrito();
}
function verCarrito(on){
  $("dw").classList.toggle("on", on);
  $("ov").classList.toggle("on", on);
  document.body.style.overflow = on ? "hidden" : "";
}
function escribirnos(){
  window.open(`https://wa.me/51${T.whatsapp}?text=` + encodeURIComponent(`Hola ${T.titulo || ""}! Quiero hacer una consulta.`), "_blank");
}
function pedirWhatsApp(){
  const ids = idsCarrito();
  if (!ids.length) return alert("Agrega al menos un producto a tu pedido.");
  if (!T.whatsapp) return alert("Esta tienda todavía no configuró su WhatsApp.");
  let total = 0;
  const lineas = ids.map(id => {
    const p = ITEMS.find(x => x.id === id), c = CAR[id], sub = Number(p.precio) * c;
    total += sub;
    return `• ${c} × ${p.nombre} — ${sol(sub)}`;
  }).join("\n");
  window.open(`https://wa.me/51${T.whatsapp}?text=` +
    encodeURIComponent(`Hola ${T.titulo || ""}! Quiero pedir:\n\n${lineas}\n\nTotal: ${sol(total)}\n\n(Pedido desde su tienda en línea)`), "_blank");
}
</script>
